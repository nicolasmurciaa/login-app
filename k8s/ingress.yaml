apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: login-app
  namespace: login-app
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /login
        pathType: Prefix
        backend:
          service:
            name: login-app
            port:
              number: 80
      - path: /register
        pathType: Prefix
        backend:
          service:
            name: login-app
            port:
              number: 80
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: login-app
            port:
              number: 80
